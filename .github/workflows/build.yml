name: Build and Publish

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Extensions & Index
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: echo "$SIGNING_KEY" | base64 -d > signingkey.jks

      - name: Build Extension APKs
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Clean up signing key
        if: always()
        run: rm -f signingkey.jks

      - name: Collect the built APKs
        run: |
          mkdir -p repo/apk
          find src -name '*-release.apk' | while read -r apk; do
            cp "$apk" "repo/apk/$(basename "$apk" | sed 's/-release\.apk$/.apk/')"
          done

      - name: Download and verify extensions inspector
        run: |
          INSPECTOR_VERSION="v1.5.0.2"
          INSPECTOR_JAR="Aniyomi.Extensions.Inspector-v1.5.0.2-r799.jar"
          EXPECTED_SHA256="102b8bf53b571f636eae89d25b08aac2c0913a4704c0b8577651b6f094c9b3c5"
          INSPECTOR_URL="https://github.com/komikku-app/aniyomi-extensions-inspector/releases/download/${INSPECTOR_VERSION}/${INSPECTOR_JAR}"

          curl -fsSL -o Inspector.jar "$INSPECTOR_URL"
          echo "${EXPECTED_SHA256}  Inspector.jar" | sha256sum -c -

      - name: Generate index.min.json and checksums
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          java -jar Inspector.jar "repo/apk" "output.json" "tmp"
          python3 .github/scripts/create-repo.py

      - name: Upload repo artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: repo-artifacts
          path: repo/
          retention-days: 1

  publish:
    name: Publish to repo branch
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repo branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: repo
          path: repo-branch

      - name: Download repo artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: repo-artifacts
          path: downloaded-repo

      - name: Update repo branch contents
        run: |
          rm -rf repo-branch/apk repo-branch/icon
          mkdir -p repo-branch/apk repo-branch/icon
          cp -r downloaded-repo/apk/* repo-branch/apk/
          cp downloaded-repo/icon/*.png repo-branch/icon/ 2>/dev/null || true
          cp downloaded-repo/index.min.json repo-branch/index.min.json
          cp downloaded-repo/index.json repo-branch/index.json 2>/dev/null || true
          cp downloaded-repo/repo.json repo-branch/repo.json 2>/dev/null || true
          cp downloaded-repo/sha256sums.txt repo-branch/sha256sums.txt 2>/dev/null || true

      - name: Commit and push repo branch
        working-directory: repo-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update repo index (${{ github.sha }})" --allow-empty
          git push origin HEAD:repo
